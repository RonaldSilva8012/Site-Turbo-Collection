<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/Camisas Turbo Collection/logo.png">
    <title>Produtos - Turbo Collection</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <style>

        header{
            padding: 10px 50px; /* Reduzi de 20px para 10px */
            position: relative;
            width: 90vw;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3;
        }

        /* Ajuste para permitir rolagem e manter a identidade visual */
       body.page-produtos { 
        overflow-y: auto !important; /* Força a barra de rolagem a aparecer */
        overflow-x: hidden;         /* Evita que a página balance para os lados */
        background-color: #0f0f1e; 
        height: auto !important;    /* Garante que o corpo não fique preso à altura da tela */
        }

        .container {
            height: auto !important;     /* Libera a altura fixa de 100vh */
            min-height: 100vh;
            overflow: visible !important; /* Permite que o conteúdo "vaze" para baixo */
        }

        /* Fixa os círculos ao fundo para que não sumam ao rolar */
        .tech-circle {
            position: fixed; /* Isso mantém o fundo parado enquanto os produtos deslizam */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 40px 8% 80px; 
            position: relative;
            z-index: 2; /* Garante que os cards fiquem na frente dos círculos */
        }

        /* Padronização dos Cards usando suas classes existentes */
        .card-produto {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 0, 0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .card-produto:hover { 
            border-color: #ff000d; 
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
        }

        .card-produto img { 
            max-width: 100%; 
            border-radius: 15px; 
            margin-bottom: 20px; 
        }
    </style>
</head>
